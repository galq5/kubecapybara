name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt and vet
        run: make lint
      - name: unit tests (race detector)
        run: go test -race ./...
      - name: build
        run: make build

  bpf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install clang and libbpf headers
        run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev
      - name: compile eBPF programs
        run: make generate
      - name: load programs into the runner kernel (verifier) and run the live tests
        run: make test-bpf

  chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: lint chart
        run: helm lint charts/kubecapybara
      - name: render chart
        run: |
          helm template capybara charts/kubecapybara > /dev/null
          helm template capybara charts/kubecapybara -n observability \
            --set namespace.create=true --set agent.l7=true --set metrics.serviceMonitor.enabled=true \
            --set rbac.viewers.groups={sre} --set imagePullSecrets[0].name=ghcr > /dev/null
          helm template capybara charts/kubecapybara --set controller.enabled=true --set hub.enabled=true \
            --set 'controller.doctor.mute={internet-egress}' --set-json 'controller.doctor.thresholds={"http-5xx-ratio":0.05}' \
            --set-json 'controller.slos=[{"name":"api","service":"shop/api","availability":99.5}]' > /dev/null
