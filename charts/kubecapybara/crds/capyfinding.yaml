apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: capyfindings.capybara.dev
  labels:
    app.kubernetes.io/part-of: kubecapybara
spec:
  group: capybara.dev
  scope: Namespaced
  names:
    kind: CapyFinding
    listKind: CapyFindingList
    plural: capyfindings
    singular: capyfinding
    shortNames: [capyf]
    categories: [capybara]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - {name: Severity, type: string, jsonPath: .spec.severity}
        - {name: Category, type: string, jsonPath: .spec.category}
        - {name: State, type: string, jsonPath: .status.state}
        - {name: Title, type: string, jsonPath: .spec.title}
        - {name: Seen, type: integer, jsonPath: .status.occurrences, priority: 1}
        - {name: Last-Seen, type: date, jsonPath: .status.lastSeen}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          description: A problem found by the kubecapybara doctor, kept in sync by capybara-controller.
          type: object
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              properties:
                rule: {type: string, description: "Stable rule id (kubectl capybara doctor -o json)."}
                severity: {type: string, enum: [INFO, WARN, CRIT]}
                category: {type: string}
                title: {type: string}
                details: {type: array, items: {type: string}}
                hint: {type: string, description: "Suggested next step."}
                subject: {type: string, description: "Workload the finding is about, or cluster."}
                subjects: {type: array, items: {type: string}}
            status:
              type: object
              properties:
                state: {type: string, enum: [Active, Resolved]}
                firstSeen: {type: string, format: date-time}
                lastSeen: {type: string, format: date-time}
                resolvedAt: {type: string, format: date-time}
                occurrences: {type: integer, format: int64}
