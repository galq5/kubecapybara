# -- Agent image. The tag defaults to the chart appVersion.
image:
  repository: ghcr.io/galq5/kubecapybara-agent
  tag: ""
  pullPolicy: IfNotPresent

# -- Needed when the image is private (e.g. ghcr.io from a private repo):
#   kubectl -n <ns> create secret docker-registry ghcr \
#     --docker-server=ghcr.io --docker-username=<user> --docker-password=<PAT with read:packages>
imagePullSecrets: []
#  - name: ghcr

nameOverride: ""
fullnameOverride: ""

agent:
  # -- API / metrics port. With hostNetwork this port is opened on every node.
  port: 9876
  # -- Collection interval.
  interval: 5s
  # -- Full resolution history kept in memory.
  fineRetention: 15m
  # -- 1-minute rollup history kept in memory.
  retention: 6h
  # -- HTTP/1.x and plaintext Postgres/MySQL/Redis tracing. Hooks every read/write syscall on the node.
  l7: false
  # -- Slow file operations (read/write/fsync on regular files). Hooks every read/write syscall.
  files: false
  # -- Report file operations slower than this.
  fileThreshold: 10ms
  # -- Collectors to disable: net, drops, dns, sched, io, proc, cgroupfs, node, profile
  disable: []
  # -- Cluster DNS domain (used for ndots waste detection).
  clusterDomain: cluster.local
  debug: false
  extraArgs: []
  extraEnv: []

# -- Agent API authentication. The agent API exposes process command lines
# (secrets are masked) and traffic data, so keep this enabled: a random token
# is generated into a Secret that kubectl-capybara reads with the caller's RBAC.
auth:
  enabled: true
  secretName: capybara-agent-token
  # -- Fixed token (default: generated once and kept across upgrades).
  token: ""

# -- Keep history and crash reports across agent restarts (hostPath on each node).
persistence:
  enabled: true
  hostPath: /var/lib/capybara

# -- Use the host network namespace (node-level conntrack stats, stable port per node).
hostNetwork: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

priorityClassName: system-node-critical

# -- Run on every node, including tainted ones (control plane, GPU nodes...).
tolerations:
  - operator: Exists

# -- Restrict the agent to some nodes, e.g. only workers:
#   nodeSelector: {node-role.kubernetes.io/worker: ""}
nodeSelector: {}
affinity: {}

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 25%

podAnnotations: {}
podLabels: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

# -- Create the namespace with the privileged Pod Security label. Leave false
# when using `helm install --create-namespace` and label it yourself:
#   kubectl label ns <ns> pod-security.kubernetes.io/enforce=privileged
namespace:
  create: false

rbac:
  create: true
  # -- Who may use `kubectl capybara` (read cluster metadata + reach agents via the API server proxy).
  viewers:
    groups: []
    users: []
    serviceAccounts: []
    # - {name: grafana, namespace: monitoring}

metrics:
  # -- Add prometheus.io/* scrape annotations to agent pods.
  podAnnotations: true
  serviceMonitor:
    # -- Create a Prometheus Operator ServiceMonitor (and a headless Service).
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
  prometheusRule:
    # -- Create a PrometheusRule with alerts on the agent metrics (needs the Prometheus Operator).
    enabled: false
    labels: {}
  grafanaDashboard:
    # -- Ship the Grafana dashboard as a ConfigMap picked up by the Grafana sidecar.
    enabled: false
    label: grafana_dashboard
    namespace: ""

# -- Hub: aggregator for large clusters (roughly 100+ nodes). Off by default:
# on small clusters querying the agents directly is just as fast and has one
# moving part less. When enabled, `kubectl capybara` finds it automatically
# (opt out with --hub=off): one request per refresh through the API server
# instead of one per node, metadata from informers instead of LISTs, and
# -n/--top filtering done in the hub so clients download only what they show.
hub:
  enabled: false
  port: 9877
  replicas: 1
  # -- Parallel agent requests per fan-out.
  concurrency: 64
  # -- Keep only the top N connections/pods per response unless the client
  # asks otherwise (0: everything). Useful above ~500 nodes.
  defaultTop: 0
  # -- Memory grows with the number of pods (informer cache) and nodes
  # (cached fan-out); 1Gi is an estimate for ~1000 nodes / 30k pods, not measured.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  extraArgs: []

# -- Controller: evaluates the doctor periodically, keeps CapyFinding objects in
# sync (`kubectl get capyfindings -A`) and notifies Slack / webhooks when a
# finding fires or resolves. The CRD ships in crds/ and is installed by Helm.
controller:
  enabled: false
  interval: 1m
  # -- Window analysed at each evaluation.
  window: 5m
  # -- Baseline before the window used for regression rules (0s disables).
  baseline: 1h
  # -- Lowest severity stored and notified: info, warn or crit.
  minSeverity: warn
  # -- Resolve a finding after it has not been seen for this long.
  resolveAfter: 10m
  # -- Delete resolved findings after this long.
  keepResolved: 1h
  # -- Namespace for findings not tied to a pod (default: release namespace).
  findingsNamespace: ""
  # -- Shown in notifications.
  clusterName: ""
  notifications:
    # -- Secret with keys webhook-url and/or slack-webhook-url (recommended).
    existingSecret: ""
    # -- Generic webhook: receives each notification as JSON.
    webhookURL: ""
    # -- Slack (or Mattermost) incoming webhook URL.
    slackWebhookURL: ""
  # -- SLOs evaluated with burn-rate alerts, same format as --slo-file:
  #   - {name: checkout-latency, workload: shop/Deployment/checkout, latency: 300ms, latencyObjective: 99}
  #   - {name: api-availability, service: shop/api, availability: 99.5}
  slos: []
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  extraArgs: []
