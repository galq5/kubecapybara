apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "capybara.fullname" . }}-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "capybara.labels" . | nindent 4 }}
    {{- include "capybara.agentSelector" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "capybara.agentSelector" . | nindent 6 }}
  {{- with .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "capybara.labels" . | nindent 8 }}
        {{- include "capybara.agentSelector" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if .Values.metrics.podAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.agent.port | quote }}
        prometheus.io/path: /metrics
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "capybara.serviceAccountName" . }}
      automountServiceAccountToken: false
      hostPID: true
      hostNetwork: {{ .Values.hostNetwork }}
      {{- if .Values.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent
          image: {{ include "capybara.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --listen=:{{ .Values.agent.port }}
            - --interval={{ .Values.agent.interval }}
            - --fine-retention={{ .Values.agent.fineRetention }}
            - --retention={{ .Values.agent.retention }}
            - --cluster-domain={{ .Values.agent.clusterDomain }}
            - --host-prefix=/host
            {{- if .Values.persistence.enabled }}
            - --state-dir=/var/lib/capybara
            {{- end }}
            - --proc=/proc
            {{- if .Values.agent.l7 }}
            - --l7
            {{- end }}
            {{- if .Values.agent.voip.enabled }}
            - --voip
            - --sip-ports={{ join "," .Values.agent.voip.sipPorts }}
            - --rtp-ports={{ .Values.agent.voip.rtpPorts }}
            {{- end }}
            {{- if .Values.agent.files }}
            - --files
            - --file-threshold={{ .Values.agent.fileThreshold }}
            {{- end }}
            {{- with .Values.agent.disable }}
            - --disable={{ join "," . }}
            {{- end }}
            {{- if .Values.agent.debug }}
            - --debug
            {{- end }}
            {{- range .Values.agent.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- if .Values.auth.enabled }}
            - name: CAPYBARA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.secretName }}
                  key: token
            {{- end }}
            {{- with .Values.agent.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: api
              containerPort: {{ .Values.agent.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: api
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
            initialDelaySeconds: 30
            periodSeconds: 30
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            privileged: true
          volumeMounts:
            - name: cgroup
              mountPath: /host/sys/fs/cgroup
              readOnly: true
            - name: tracefs
              mountPath: /sys/kernel/tracing
            - name: debugfs
              mountPath: /sys/kernel/debug
            - name: bpffs
              mountPath: /sys/fs/bpf
            {{- if .Values.persistence.enabled }}
            - name: state
              mountPath: /var/lib/capybara
            {{- end }}
      volumes:
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
        {{- if .Values.persistence.enabled }}
        - name: state
          hostPath:
            path: {{ .Values.persistence.hostPath }}
            type: DirectoryOrCreate
        {{- end }}
