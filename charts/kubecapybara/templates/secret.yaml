{{- if .Values.auth.enabled }}
{{- /* Generated once and kept across upgrades (lookup); override with auth.token. */}}
{{- $token := .Values.auth.token }}
{{- if not $token }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.auth.secretName }}
{{- if and $existing $existing.data (hasKey $existing.data "token") }}
{{- $token = index $existing.data "token" | b64dec }}
{{- else }}
{{- $token = randAlphaNum 48 }}
{{- end }}
{{- end }}
# Shared token required by the agent API (/v1/*). kubectl-capybara reads it
# with the caller's RBAC, so only users allowed to get this Secret (and use
# pods/proxy) can query the agents.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.auth.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "capybara.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ $token | b64enc | quote }}
{{- end }}
